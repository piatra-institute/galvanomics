[project]
name = "blender-addon"
version = "0.1.0"
description = "Blender 5.2 extension that imports and plays back tissue run bundles"
license = "GPL-3.0-or-later"
authors = [{ name = "Piatra Institute" }]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
assets = [
    "fast-simplification>=0.2.0",
    "gemmi>=0.7.5",
    "scikit-image>=0.26.0",
]
dev = [
    "numpy>=2,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["blender: runs the real Blender binary headless"]

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
