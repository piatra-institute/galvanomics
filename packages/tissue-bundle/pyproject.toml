[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tissue-bundle"
version = "0.2.0"
description = "On-disk run bundle for bioelectric tissue simulations: geometry, time series, units, provenance"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Piatra Institute" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "pydantic>=2.11,<3",
    "typer>=0.15,<1",
]

[project.scripts]
tissuebundle = "tissuebundle.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.hatch.build.targets.wheel]
packages = ["src/tissuebundle"]
